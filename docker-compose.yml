services:
  postgres:
    image: postgres:17
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulse_crm
    ports:
      - "5433:5432"
    volumes:
      - pulse_postgres_data:/var/lib/postgresql/data

volumes:
  pulse_postgres_data: